<style>
  :root{
    --terracotta:#c1440e;
    --ochre:#d99a2b;
    --cream:#faf3e8;
    --ink:#2b2320;
    --card:#ffffff;
    --border:#e7ddce;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #app{display:flex;flex-direction:column;height:100dvh;}
  header{padding:14px 16px calc(10px + env(safe-area-inset-top,0)) 16px;
    padding-top:calc(14px + env(safe-area-inset-top,0));
    background:var(--terracotta);color:#fff;flex-shrink:0;}
  header h1{margin:0 0 2px 0;font-size:19px;font-weight:700;}
  header p{margin:0;font-size:12.5px;opacity:.9;}
  nav#tabs{display:flex;overflow-x:auto;gap:6px;padding:10px 12px;background:var(--terracotta);
    flex-shrink:0;-webkit-overflow-scrolling:touch;}
  nav#tabs button{flex:0 0 auto;border:none;padding:8px 14px;border-radius:20px;font-size:13px;
    font-weight:600;background:rgba(255,255,255,.18);color:#fff;white-space:nowrap;}
  nav#tabs button.active{background:#fff;color:var(--terracotta);}
  main{flex:1;overflow-y:auto;padding:14px 12px 30px 12px;-webkit-overflow-scrolling:touch;}
  #daytitle{font-size:15px;font-weight:700;margin:2px 4px 10px 4px;color:var(--terracotta);}
  #map{width:100%;height:220px;border-radius:14px;margin-bottom:14px;border:1px solid var(--border);}
  .stop{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;
    margin-bottom:10px;position:relative;}
  .stop.done{opacity:.5;}
  .stop.meal{background:#fff9f0;border-color:#efd9b6;}
  .stop-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .stop-name{font-size:15.5px;font-weight:700;margin:0;}
  .stop-time{font-size:12.5px;color:var(--terracotta);font-weight:700;white-space:nowrap;}
  .stop-note{font-size:12.5px;color:#5a5049;margin:4px 0 8px 0;line-height:1.35;}
  .stop-food{font-size:12px;color:#6b5f54;margin:0 0 4px 0;line-height:1.38;}
  .stop-vegan{font-size:12px;color:#3f7d3f;margin:0 0 8px 0;line-height:1.38;}
  .stop-vegan b{font-weight:700;}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:20px;color:#fff;margin-right:6px;margin-bottom:6px;}
  .badge.walk{background:#8a8478;}
  .badge.meal{background:#a5672b;}
  .actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .actions a, .actions button{flex:1;min-width:120px;text-align:center;text-decoration:none;
    font-size:12.5px;font-weight:700;padding:9px 8px;border-radius:10px;border:none;}
  .btn-map{background:var(--terracotta);color:#fff;}
  .btn-dir{background:#f0e6d6;color:var(--terracotta);}
  .check{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;
    border:2px solid var(--border);background:#fff;}
  .check.checked{background:var(--terracotta);border-color:var(--terracotta);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;}
  .leg{text-align:center;font-size:11.5px;color:#8a8072;margin:-2px 0 10px 4px;}
  .eats{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin:16px 0 8px;}
  .eats h3{margin:0 0 4px 0;font-size:14px;color:var(--terracotta);}
  .eats-sub{margin:0 0 6px 0;font-size:11.5px;color:#8a8072;line-height:1.35;}
  .eat{padding:9px 0;border-top:1px solid var(--border);}
  .eat-name{font-size:13.5px;font-weight:700;}
  .eat-meta{font-size:11.5px;color:#8a8072;font-weight:600;margin-left:7px;}
  .eat-why{font-size:12px;color:#5a5049;margin:3px 0 5px 0;line-height:1.38;}
  .eat a{font-size:12px;font-weight:700;color:var(--terracotta);text-decoration:none;}
</style>
</head>

let currentDay = 1;
let map;
const STORAGE_KEY = "romeTripChecklist";
function getChecked(){ try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");}catch(e){return {};} }
function setChecked(obj){ localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); }
function stopQuery(s){ return s.q ? encodeURIComponent(s.q) : `${s.lat},${s.lng}`; }
function gmapsView(s){ return `https://www.google.com/maps/search/?api=1&query=${stopQuery(s)}`; }
function gmapsDir(from,to,mode){ return `https://www.google.com/maps/dir/?api=1&origin=${stopQuery(from)}&destination=${stopQuery(to)}&travelmode=${mode||'walking'}`; }

function renderTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  DATA.forEach(d=>{
    const b = document.createElement('button');
    b.textContent = 'Day '+d.day;
    if(d.day===currentDay) b.className='active';
    b.onclick = ()=>{ currentDay=d.day; renderAll(); };
    nav.appendChild(b);
  });
}
function renderMap(day){
  const container = document.getElementById('map');
  try{
    if(map){ map.remove(); map = null; }   // tear the old map down so re-init works when switching days
    container.innerHTML='';
    if(typeof L === 'undefined') throw new Error('Leaflet failed to load');
    map = L.map(container,{zoomControl:false}).setView([41.895,12.478],13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,
      attribution:'&copy; OpenStreetMap'}).addTo(map);
    // frame the day's sightseeing route; the home base can sit far outside it
    const route = day.stops.filter(s=>!s.home).map(s=>[s.lat,s.lng]);
    day.stops.forEach((s,i)=>{
      L.circleMarker([s.lat,s.lng],{radius:s.home?7:9,
        fillColor:s.home?'#2b2320':(s.meal?'#a5672b':'#c1440e'),fillOpacity:1,color:'#fff',weight:2})
        .addTo(map).bindPopup(`<b>${i+1}. ${s.name}</b><br>${s.time}`);
    });
    L.polyline(route,{color:'#c1440e',weight:3,dashArray:'6 6',opacity:.7}).addTo(map);
    map.fitBounds(L.latLngBounds(route),{padding:[24,24]});
    setTimeout(()=>{ try{ map.invalidateSize(); }catch(e){} }, 60);  // fixes grey/half-drawn tiles
  }catch(e){
    console.warn('Map unavailable:', e);
    map = null;
    container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;'
      + 'height:100%;padding:16px;text-align:center;font-size:12.5px;color:#8a8072;">'
      + 'Map unavailable right now — use the “Open in Maps” buttons on each stop below.</div>';
  }
}
function renderStops(day){
  const wrap = document.getElementById('stops');
  wrap.innerHTML='';
  const checked = getChecked();
  day.stops.forEach((s,i)=>{
    if(i>0 && s.leg){
      const leg = document.createElement('div');
      leg.className='leg';
      leg.textContent = '↓ '+s.leg;
      wrap.appendChild(leg);
    }
    const el = document.createElement('div');
    el.className = 'stop'+(s.meal?' meal':'')+(checked[s.id]?' done':'');
    let badges = '';
    if(s.meal){
      badges += `<span class="badge meal">🍴 Food stop</span>`;
    }
    if(s.metro){
      const color = s.metro.line==='B' ? '#1f6fb2' : (s.metro.line==='A/B'?'#8a4fae':'#e07b00');
      badges += `<span class="badge" style="background:${color}">Ⓜ️ ${s.metro.station} · Line ${s.metro.line}</span>`;
    }
    if(s.walkNote){
      badges += `<span class="badge walk">🚶 ${s.walkNote}</span>`;
    }
    const prev = day.stops[i-1];
    el.innerHTML = `
      <div class="check ${checked[s.id]?'checked':''}" data-id="${s.id}">${checked[s.id]?'✓':''}</div>
      <div class="stop-top"><p class="stop-name">${i+1}. ${s.name}</p><span class="stop-time">${s.time}</span></div>
      ${s.note ? `<p class="stop-note">${s.note}</p>` : ''}
      ${s.food ? `<p class="stop-food">🍽️ ${s.food}</p>` : ''}
      ${s.vegan ? `<p class="stop-vegan"><b>🌱 Vegan:</b> ${s.vegan}</p>` : ''}
      <div>${badges}</div>
      <div class="actions">
        <a class="btn-map" href="${gmapsView(s)}" target="_blank" rel="noopener">📍 Open in Maps</a>
        ${prev ? `<a class="btn-dir" href="${gmapsDir(prev,s)}" target="_blank" rel="noopener">↗ Directions here</a>` : ''}
      </div>
    `;
    wrap.appendChild(el);
  });
  if(day.eats && day.eats.length){
    const box = document.createElement('div');
    box.className = 'eats';
    box.innerHTML = '<h3>🍴 Cheap local eats near this route</h3>'
      + '<p class="eats-sub">Well reviewed, local, wallet-friendly. Many are cash-only and don’t take bookings — check days/hours first.</p>'
      + day.eats.map(e=>`<div class="eat">
          <div><span class="eat-name">${e.name}</span><span class="eat-meta">${e.kind} · ${e.price}</span></div>
          <div class="eat-why">${e.why}</div>
          <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.q)}" target="_blank" rel="noopener">📍 Open in Maps</a>
        </div>`).join('');
    wrap.appendChild(box);
  }
  wrap.querySelectorAll('.check').forEach(c=>{
    c.onclick = ()=>{
      const id = c.dataset.id;
      const st = getChecked();
      st[id] = !st[id];
      setChecked(st);
      renderStops(day);
    };
  });
}
function renderAll(){
  const day = DATA.find(d=>d.day===currentDay);
  renderTabs();
  document.getElementById('daytitle').textContent = `Day ${day.day} · ${day.date} — ${day.title}`;
  renderStops(day);   // itinerary + food list first, so it shows even if the map can't
  renderMap(day);
}
renderAll();
</script>
<script>
// Register the service worker so the app shell works offline after first load.
// Auto-reload once when a new version takes over, so you never get stuck on a cached page.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    var hadController = !!navigator.serviceWorker.controller;
    var reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (hadController && !reloaded) { reloaded = true; window.location.reload(); }
    });
    navigator.serviceWorker.register('sw.js')
      .then(function (reg) { reg.update(); })
      .catch(function (err) { console.warn('Service worker registration failed:', err); });
  });
}
</script>
